name: fortress

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fortress-app
    volumes:
      - ../app:/workspace
    tty: true

  ui:
    build: 
      context: ./ui
      dockerfile: Dockerfile
    container_name: fortress-ui
    volumes:
      - ../ui:/workspace
      - fortress-ui-node_modules:/workspace/node_modules
    tty: true
    command: /bin/bash

volumes:
  fortress-ui-node_modules: